# Uygulamayı GitHub Pages'te ücretsiz yayınlar.
# Yöntem: derlenen site "gh-pages" dalına itilir; GitHub bu dalı görünce
# Pages'i otomatik etkinleştirir (Settings'te elle bir şey yapmak gerekmez).
name: Yayinla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle-ve-yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: gh-pages dalına yayınla
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
